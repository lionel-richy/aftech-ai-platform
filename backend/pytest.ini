[pytest]
# "session" : une seule boucle d'événements pour toute la suite de tests —
# nécessaire pour réutiliser en sécurité le moteur asyncpg mis en cache
# (voir app/db/session.py) entre plusieurs tests async (test_db_*.py).
# N'affecte pas les tests synchrones existants (FakeRagEngine, etc.).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
